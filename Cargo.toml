[package]
name = "codex-image"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A native GPUI image-generation studio powered by the Codex CLI"

[dependencies]
anyhow = "1"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
gpui = { git = "https://github.com/zed-industries/zed", rev = "ba0e2a94295c99f48f00cdaa2858a29adae6f09d", package = "gpui" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ba0e2a94295c99f48f00cdaa2858a29adae6f09d", package = "gpui_platform", features = ["font-kit"] }
image = { version = "0.25", default-features = false, features = ["avif", "bmp", "gif", "ico", "jpeg", "png", "pnm", "tiff", "webp"] }
libc = "0.2"
lz4_flex = "0.14.0"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25.0"
foreign-types = "0.5"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
