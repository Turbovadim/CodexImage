[workspace]
members = ["."]
resolver = "2"

[package]
name = "codex-image"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "A native GPUI image-generation studio powered by the Codex CLI"

[dependencies]
anyhow = "1"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
gpui = { git = "https://github.com/Bisquit-Host/gpui-bisquit", rev = "9a8dc3e3b4f40e78f61ce36fca429e570828373a", package = "gpui" }
gpui_platform = { git = "https://github.com/Bisquit-Host/gpui-bisquit", rev = "9a8dc3e3b4f40e78f61ce36fca429e570828373a", package = "gpui_platform", features = ["font-kit"] }
image = { version = "0.25", default-features = false, features = ["avif", "bmp", "gif", "ico", "jpeg", "png", "pnm", "tiff", "webp"] }
libc = "0.2"
lz4_flex = "0.14.0"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25.0"
foreign-types = "0.5"

# GPUI's Linux windowing backends are opt-in. Without them gpui_linux silently
# falls back to a headless platform: the app runs but never opens a window.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { git = "https://github.com/Bisquit-Host/gpui-bisquit", rev = "9a8dc3e3b4f40e78f61ce36fca429e570828373a", package = "gpui_platform", features = ["font-kit", "wayland", "x11"] }

# Builds the file:// URL GPUI's desktop opener takes on Linux and the BSDs.
[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
url = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
gpui = { git = "https://github.com/Bisquit-Host/gpui-bisquit", rev = "9a8dc3e3b4f40e78f61ce36fca429e570828373a", features = ["test-support"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
