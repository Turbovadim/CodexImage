[workspace]
members = ["crates/gpui_apple", "crates/gpui_linux", "crates/gpui_macos"]
resolver = "2"

[workspace.package]
edition = "2024"
publish = false

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.metadata.gpui-occlusion]
upstream-zed-rev = "d01f1258376ec2fb498d8386e734b0dabdbb9fe5"

[workspace.dependencies]
# Added for the vendored gpui_linux (Wayland image clipboard patch).
accesskit_unix = "0.22"
bytemuck = "1"
gpui_wgpu = { git = "https://github.com/zed-industries/zed", rev = "d01f1258376ec2fb498d8386e734b0dabdbb9fe5", package = "gpui_wgpu" }
http_client = { git = "https://github.com/zed-industries/zed", rev = "d01f1258376ec2fb498d8386e734b0dabdbb9fe5", package = "http_client" }
smol = "2.0"
url = "2.2"
oo7 = { git = "https://github.com/zed-industries/oo7", rev = "731c1215edb6905876c6137ab300428c7b8d7c13", version = "0.6", default-features = false }
notify-rust = "4"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "inhibit", "open_uri", "file_chooser", "settings"] }
xkbcommon = { version = "0.8", default-features = false }
scap = { git = "https://github.com/zed-industries/scap", rev = "b5c86ec58dd4b6b7732bf6ac8be03d6b1f190a82", default-features = false, package = "zed-scap", version = "0.0.8-zed" }
accesskit = { version = "0.24.0", features = ["enumn"] }
accesskit_macos = "0.26.0"
anyhow = "1.0.86"
async-task = "4.7"
block2 = "0.6"
cbindgen = { version = "0.28.0", default-features = false }
collections = { git = "https://github.com/zed-industries/zed", rev = "d01f1258376ec2fb498d8386e734b0dabdbb9fe5", version = "0.1.0" }
core-foundation = "0.10"
core-foundation-sys = "0.8.6"
core-graphics = "0.24"
core-text = "21"
ctor = "1.0.12"
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
etagere = "0.2"
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", default-features = false }
foreign-types = "0.5"
futures = "0.3.34"
gpui = { git = "https://github.com/zed-industries/zed", rev = "d01f1258376ec2fb498d8386e734b0dabdbb9fe5", default-features = false }
gpui_apple = { path = "crates/gpui_apple" }
gpui_util = { git = "https://github.com/zed-industries/zed", rev = "d01f1258376ec2fb498d8386e734b0dabdbb9fe5" }
image = { version = "0.25.1", default-features = false, features = [
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "rayon",
    "tga",
    "tiff",
    "webp",
] }
itertools = "0.14.0"
libc = "0.2"
log = { version = "0.4", default-features = false, features = ["std"] }
mach2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSAlert",
    "NSAppearance",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSCursor",
    "NSDocumentController",
    "NSDragging",
    "NSDraggingItem",
    "NSEvent",
    "NSGraphics",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSScreen",
    "NSScroller",
    "NSTrackingArea",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
    "block2",
    "objc2-core-foundation",
] }
objc2-core-foundation = { version = "=0.3.2", default-features = false }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGDirectDisplay"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["CMSampleBuffer", "objc2-core-video"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFont", "CTFontDescriptor"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["CVBuffer", "CVImageBuffer"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "NSArray",
    "NSAttributedString",
    "NSBundle",
    "NSCoder",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSNull",
    "NSObjCRuntime",
    "NSObject",
    "NSProcessInfo",
    "NSRange",
    "NSRunLoop",
    "NSSet",
    "NSString",
    "NSURL",
    "NSValue",
    "objc2-core-foundation",
    "std",
] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalDisplayLink", "CAMetalLayer", "objc2-metal"] }
objc2-screen-capture-kit = { version = "=0.3.2", default-features = false, features = [
    "block2",
    "dispatch2",
    "objc2-core-graphics",
    "objc2-core-media",
    "SCShareableContent",
    "SCStream",
    "std"
] }
objc2-security = { version = "0.3.2", default-features = false, features = ["std", "SecBase", "SecItem"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTCoreTypes", "UTType"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNNotification",
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
parking_lot = "0.12.1"
pathfinder_geometry = "0.5"
raw-window-handle = "0.6"
scheduler = { git = "https://github.com/zed-industries/zed", rev = "d01f1258376ec2fb498d8386e734b0dabdbb9fe5" }
semver = { version = "1.0", features = ["serde"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
smallvec = { version = "1.6", features = ["union", "const_new"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0.12"
uuid = { version = "1.1", features = ["serde"] }
