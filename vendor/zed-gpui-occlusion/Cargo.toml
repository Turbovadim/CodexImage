[workspace]
members = ["crates/gpui_apple", "crates/gpui_macos"]
resolver = "2"

[workspace.package]
edition = "2024"
publish = false

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.metadata.gpui-occlusion]
upstream-zed-rev = "46b11cc550d5bb0585fa912dfaa1218cf52e5025"

[workspace.dependencies]
accesskit = { version = "0.24.0", features = ["enumn"] }
accesskit_macos = "0.26.0"
anyhow = "1.0.86"
async-task = "4.7"
block2 = "0.6"
cbindgen = { version = "0.28.0", default-features = false }
cocoa = "=0.26.0"
collections = { git = "https://github.com/zed-industries/zed", rev = "46b11cc550d5bb0585fa912dfaa1218cf52e5025", version = "0.1.0" }
core-foundation = "0.10"
core-foundation-sys = "0.8.6"
core-graphics = "0.24"
core-text = "21"
core-video = { version = "0.5", default-features = false, features = ["link"] }
ctor = "1.0.12"
derive_more = { version = "2.1", features = ["deref", "deref_mut", "from_str"] }
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
etagere = "0.2"
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", default-features = false }
foreign-types = "0.5"
futures = "0.3.34"
gpui = { git = "https://github.com/zed-industries/zed", rev = "46b11cc550d5bb0585fa912dfaa1218cf52e5025", default-features = false }
gpui_apple = { path = "crates/gpui_apple" }
gpui_util = { git = "https://github.com/zed-industries/zed", rev = "46b11cc550d5bb0585fa912dfaa1218cf52e5025" }
image = { version = "0.25.1", default-features = false, features = [
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "rayon",
    "tga",
    "tiff",
    "webp",
] }
itertools = "0.14.0"
libc = "0.2"
log = { version = "0.4", default-features = false, features = ["std"] }
mach2 = "0.6"
metal = "0.33"
objc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSDraggingItem",
    "NSGraphics",
    "NSImage",
    "NSOpenPanel",
    "NSPanel",
    "NSPasteboard",
    "NSResponder",
    "NSSavePanel",
    "NSScreen",
    "NSTrackingArea",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "block2",
    "objc2-core-foundation",
] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGDirectDisplay"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["CMSampleBuffer", "objc2-core-video"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "NSArray",
    "NSAttributedString",
    "NSCoder",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSNull",
    "NSObjCRuntime",
    "NSObject",
    "NSProcessInfo",
    "NSRange",
    "NSRunLoop",
    "NSSet",
    "NSString",
    "NSURL",
    "NSValue",
    "objc2-core-foundation",
    "std",
] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer"] }
objc2-screen-capture-kit = { version = "=0.3.2", default-features = false, features = [
    "block2",
    "dispatch2",
    "objc2-core-graphics",
    "objc2-core-media",
    "SCShareableContent",
    "SCStream",
    "std"
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNNotification",
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
parking_lot = "0.12.1"
pathfinder_geometry = "0.5"
raw-window-handle = "0.6"
scheduler = { git = "https://github.com/zed-industries/zed", rev = "46b11cc550d5bb0585fa912dfaa1218cf52e5025" }
semver = { version = "1.0", features = ["serde"] }
serde_json = "1"
smallvec = { version = "1.6", features = ["union", "const_new"] }
strum = { version = "0.28", features = ["derive"] }
uuid = { version = "1.1", features = ["serde"] }
