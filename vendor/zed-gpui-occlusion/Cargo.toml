[workspace]
members = ["crates/gpui_apple", "crates/gpui_macos"]
resolver = "2"

[workspace.package]
edition = "2024"
publish = false

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.metadata.gpui-occlusion]
upstream-zed-rev = "ac099b4a809a564f06907125e7a536c33cb60084"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "ac099b4a809a564f06907125e7a536c33cb60084", default-features = false }
collections = { git = "https://github.com/zed-industries/zed", rev = "ac099b4a809a564f06907125e7a536c33cb60084", version = "0.1.0" }
gpui_apple = { path = "crates/gpui_apple" }
gpui_util = { git = "https://github.com/zed-industries/zed", rev = "ac099b4a809a564f06907125e7a536c33cb60084" }
media = { git = "https://github.com/zed-industries/zed", rev = "ac099b4a809a564f06907125e7a536c33cb60084" }
accesskit = { version = "0.24.0", features = ["enumn"] }
accesskit_macos = "0.26.0"
anyhow = "1.0.86"
async-task = "4.7"
block = "0.1"
block2 = "0.6"
cbindgen = { version = "0.28.0", default-features = false }
cocoa = "=0.26.0"
core-foundation = "0.10"
core-foundation-sys = "0.8.6"
core-graphics = "0.24"
core-text = "21"
core-video = { version = "0.5.2", features = ["metal"] }
ctor = "1.0.12"
derive_more = { version = "2.1.1", features = ["add", "add_assign", "deref", "deref_mut", "display", "from", "from_str", "mul", "mul_assign", "not"] }
etagere = "0.2"
foreign-types = "0.5"
futures = "0.3.32"
image = { version = "0.25.1", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"] }
itertools = "0.14.0"
libc = "0.2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
mach2 = "0.5"
metal = "0.33"
objc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSButton", "NSControl", "NSGraphics", "NSResponder", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSAttributedString", "NSBundle", "NSCoder", "NSData", "NSDate", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSNotification", "NSNull", "NSObjCRuntime", "NSObject", "NSProcessInfo", "NSRange", "NSRunLoop", "NSSet", "NSString", "NSURL", "NSUndoManager", "NSValue", "objc2-core-foundation", "std"] }
objc2-user-notifications = "0.3"
parking_lot = "0.12.1"
pathfinder_geometry = "0.5"
raw-window-handle = "0.6"
semver = { version = "1.0", features = ["serde"] }
smallvec = { version = "1.6", features = ["union", "const_new"] }
strum = { version = "0.28", features = ["derive"] }
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }
